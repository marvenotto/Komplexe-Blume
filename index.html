<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - Ethereal Cloud</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #050505; /* Echtes Schwarz wie im Video */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.2); letter-spacing: 8px; font-size: 11px;
            font-weight: 300; pointer-events: none; text-transform: uppercase;
            animation: fadeIn 5s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Retina Display Support (begrenzt auf 2 für gute Performance am Handy)
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width, height;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // --- PRE-RENDERING DER WOLKEN-PARTIKEL ---
    const particleTextures = [];
    const colors = [
        { r: 120, g: 80, b: 150 },  // Dunkles Lila
        { r: 180, g: 120, b: 200 }, // Mittleres Flieder
        { r: 230, g: 160, b: 210 }, // Zartes Rosa
        { r: 255, g: 255, b: 255 }  // Weiß für Highlights
    ];

    function createParticleTextures() {
        colors.forEach((col) => {
            let pCanvas = document.createElement('canvas');
            pCanvas.width = 20; pCanvas.height = 20;
            let pCtx = pCanvas.getContext('2d');
            
            // Weicher Glow-Effekt
            let grad = pCtx.createRadialGradient(10, 10, 0, 10, 10, 10);
            grad.addColorStop(0, `rgba(${col.r}, ${col.g}, ${col.b}, 1)`);
            grad.addColorStop(0.3, `rgba(${col.r}, ${col.g}, ${col.b}, 0.6)`);
            grad.addColorStop(1, `rgba(${col.r}, ${col.g}, ${col.b}, 0)`);
            
            pCtx.fillStyle = grad;
            pCtx.beginPath(); pCtx.arc(10, 10, 10, 0, Math.PI * 2); pCtx.fill();
            particleTextures.push(pCanvas);
        });
    }
    createParticleTextures();

    let allBranches = [];
    let allParticles = [];
    let isShattering = false;

    // --- DIE WINZIGEN LEUCHTPUNKTE ---
    class CloudParticle {
        constructor(x, y, delay) {
            this.x = x; this.y = y;
            
            // Wähle eine Farbe per Zufall (Lila/Flieder/Rosa)
            this.texture = particleTextures[Math.floor(Math.random() * particleTextures.length)];
            
            this.baseSize = 0.5 + Math.random() * 2.5; // Sehr feine Punkte
            this.currentSize = 0;
            
            this.progress = 0;
            this.delay = delay;
            
            // Physik für den Zerfall
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 1) * 4;
            this.gravity = 0.1;
            this.alpha = 1;
        }

        update(globalProgress) {
            if (!isShattering) {
                if (globalProgress > this.delay && this.progress < 1) {
                    this.progress += 0.05; 
                    if (this.progress > 1) this.progress = 1;
                    
                    // Weiches Aufpoppen
                    let bounce = Math.sin(this.progress * Math.PI / 2);
                    this.currentSize = this.baseSize * bounce;
                }
            } else {
                // Zerfalls-Physik
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.01;
            }
        }

        draw(ctx) {
            if (this.progress <= 0 || this.alpha <= 0) return;
            ctx.globalAlpha = this.alpha;
            // -10, weil das vorgefertigte Bild 20x20 groß ist (Mitte ist bei 10)
            ctx.drawImage(this.texture, this.x - this.currentSize * 10, this.y - this.currentSize * 10, this.currentSize * 20, this.currentSize * 20);
        }
    }

    // --- DIE FEINEN ÄSTE WIE IM VIDEO ---
    class FineBranch {
        constructor(x, y, angle, length, width, depth, maxDepth, delay) {
            this.startX = x; this.startY = y;
            this.angle = angle; 
            this.length = length;
            this.width = width; 
            this.depth = depth;
            this.maxDepth = maxDepth;
            this.delay = delay;
            
            this.progress = 0;
            this.hasSpawned = false;
            
            this.curve = (Math.random() - 0.5) * 0.4;
            this.endX = this.startX;
            this.endY = this.startY;
            
            allBranches.push(this);
        }

        update(globalProgress) {
            if (isShattering) return; 

            if (globalProgress > this.delay && this.progress < 1) {
                this.progress += 0.035; // Schnelles, fließendes Wachstum
                if (this.progress > 1) this.progress = 1;
                
                this.endX = this.startX + Math.cos(this.angle + this.curve) * this.length * this.progress;
                this.endY = this.startY + Math.sin(this.angle + this.curve) * this.length * this.progress;
            }

            if (this.progress > 0.8 && !this.hasSpawned) {
                this.hasSpawned = true;
                
                if (this.depth < this.maxDepth) {
                    // Feuerwerks-Verzweigung (mehr Äste am Anfang, weniger am Ende)
                    let branchesCount = this.depth === 0 ? 4 : (2 + Math.floor(Math.random() * 3));
                    
                    for (let i = 0; i < branchesCount; i++) {
                        let nAngle = this.angle + (Math.random() - 0.5) * 1.5;
                        let nLen = this.length * (0.6 + Math.random() * 0.2);
                        let nWidth = this.width * 0.6;
                        new FineBranch(this.endX, this.endY, nAngle, nLen, nWidth, this.depth + 1, this.maxDepth, globalProgress);
                    }
                } else {
                    // Generiert die Blüten-Wolke am Astende
                    this.spawnCloud(this.endX, this.endY, 25, globalProgress);
                }
            }
        }

        spawnCloud(x, y, amount, globalProgress) {
            for(let i = 0; i < amount; i++) {
                let radius = 5 + Math.random() * 35;
                let a = Math.random() * Math.PI * 2;
                
                let px = x + Math.cos(a) * radius;
                let py = y + Math.sin(a) * radius;
                
                let pDelay = globalProgress + Math.random() * 0.5;
                allParticles.push(new CloudParticle(px, py, pDelay));
            }
        }

        draw(ctx) {
            if (this.progress === 0 || isShattering) return;
            
            ctx.beginPath();
            ctx.moveTo(this.startX, this.startY);
            let cpX = (this.startX + this.endX)/2 + Math.sin(this.angle) * (this.length*0.1);
            let cpY = (this.startY + this.endY)/2 + Math.cos(this.angle) * (this.length*0.1);
            ctx.quadraticCurveTo(cpX, cpY, this.endX, this.endY);
            
            // Hellgrüne, extrem feine Stiele wie im Video
            ctx.strokeStyle = `rgba(130, 190, 120, 0.8)`;
            ctx.lineWidth = Math.max(0.3, this.width); 
            ctx.lineCap = 'round';
            ctx.stroke();
        }
    }

    // --- SYSTEM CONTROLLER ---
    let time = 0;

    function plantNew(x, y) {
        if (isShattering) {
            allBranches = [];
            allParticles = [];
            isShattering = false;
        }

        let maxDepth = 4 + Math.floor(Math.random() * 2); // Kürzere Verzweigung für die "Feuerwerks-Optik"
        let startWidth = 2.5; // Dünner Hauptstamm
        let startLength = 120 + Math.random() * 60; // Sehr langer, eleganter Hals
        let baseAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.1;
        
        time = 0; 
        new FineBranch(x, y, baseAngle, startLength, startWidth, 0, maxDepth, 0);
    }

    function shatterEverything() {
        if (allBranches.length === 0 || isShattering) return;
        isShattering = true;
        allBranches = []; // Äste verschwinden einfach, Blüten fallen
    }

    // --- EINGABEN ---
    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        let tapLength = now - lastTap;
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);

        if (tapLength < 300 && tapLength > 0) {
            shatterEverything(); // Doppelklick zerbricht
        } else {
            setTimeout(() => {
                if (Date.now() - lastTap >= 300) {
                    if (x !== undefined && y !== undefined) plantNew(x, y);
                }
            }, 300);
        }
        lastTap = now;
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('touchstart', handleTouch, {passive: true});
    window.addEventListener('dblclick', shatterEverything);

    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.
